<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Basket | Conlon Interiors</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/app.js"></script>
  <script src="js/humm.js"></script>
  <script src="js/cart.js"></script>
</head>
<body>
  <div id="header"></div>

  <section class="section section--tight">
    <div class="wrap">
      <span class="eyebrow">Basket</span>
      <h1 style="font-size:clamp(2rem,4vw,3rem)">Your basket</h1>
      <div class="cart-layout" style="margin-top:32px">
        <div class="panel" id="cartLines"></div>
        <aside class="panel panel--sticky" id="cartSummary"></aside>
      </div>
    </div>
  </section>

  <div id="footer"></div>
  <script>
    function renderCart() {
      const items = CART.load();
      const lines = qs('#cartLines'), sum = qs('#cartSummary');
      if (!items.length) {
        lines.innerHTML = `<div class="empty"><h3>Your basket is empty.</h3><p>Browse the showroom online or call in to Newbridge.</p><a class="btn btn--primary" href="shop.html">Shop now</a></div>`;
        sum.innerHTML = `<h3>Summary</h3><p style="color:var(--muted)">Nothing here yet.</p>`;
        return;
      }
      lines.innerHTML = items.map(CART.lineHtml).join('') + `<div style="display:flex;justify-content:space-between;margin-top:16px;flex-wrap:wrap;gap:10px"><a class="link-arrow" href="shop.html">Continue shopping</a><button class="cart-line__remove" onclick="CART.clear()">Empty basket</button></div>`;
      CART.bindLines(lines);
      const sub = CART.subtotal();
      const bespoke = CART.hasBespoke();
      sum.innerHTML = `
        <h3>Summary</h3>
        <div class="totals">
          <div><span>Subtotal</span><strong>${money(sub)}</strong></div>
          <div><span>Delivery</span><span>${sub >= SITE.delivery.freeOver ? 'Free' : 'Calculated at checkout'}</span></div>
          <div class="totals__grand"><span>Total</span><span>${money(sub)}</span></div>
        </div>
        <a class="btn btn--primary btn--block btn--lg" href="checkout.html">Proceed to checkout</a>
        <p style="font-size:.78rem;color:var(--muted);margin:12px 0 20px;text-align:center">${SITE.business.vatNote}</p>
        <div id="cartHumm"></div>`;
      const hb = qs('#cartHumm'); hb.innerHTML = HUMM.box(sub); HUMM.bind(hb);
    }
    document.addEventListener('site:ready', renderCart);
    document.addEventListener('cart:change', renderCart);
  </script>
</body>
</html>
